# Render Blueprint — Dashboard에서 "New +" → "Blueprint" → 이 저장소 선택 시 자동 구성.
# 아래 sync:false 항목은 배포 중에 값 입력을 요청합니다(.env 값 그대로 붙여넣기).
services:
  - type: web
    name: intelligence-poc
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    # free 플랜(512MB) 메모리 여유 + 인프로세스 캐시(corpCode·종목 스냅샷) 공유를 위해
    # 워커 1 + 스레드 4 (탭이 동시에 던지는 API 호출은 스레드로 병렬 처리).
    startCommand: gunicorn main.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --worker-class gthread --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # 스냅샷 1건당 AI 재시도 상한(모든 탭 공통 — 이름은 예전 그대로 유지)
      - key: POLICY_MAX_GEMINI_CALLS_PER_DAY
        value: "3"
      # 앱 전체 하루 Gemini 실호출 상한(비용 통제, 0이면 무제한)
      - key: GEMINI_MAX_CALLS_PER_DAY
        value: "40"
      # Gemini 모델명(비우면 코드 기본값 gemini-3.6-flash)
      - key: GEMINI_MODEL
        sync: false
      - key: DATA_GO_KR_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: ECOS_API_KEY
        sync: false
      - key: DART_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: WARMUP_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
