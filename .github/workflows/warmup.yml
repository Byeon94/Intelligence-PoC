name: Daily snapshot warmup

on:
  schedule:
    # 17:00 UTC = 02:00 KST(다음날) — 그날 전체 스냅샷 생성.
    - cron: "0 17 * * *"
    # 22:00 UTC = 07:00 KST — 미국 장 마감 후 시장 브리핑·뉴스류만 재생성(mode=morning).
    - cron: "0 22 * * *"
    # GitHub Actions 스케줄은 부하에 따라 크게 늦어진다 — 00:01 로 걸었을 때 실제 시작은 02:37~04:49 KST(2026-09 기록).
  workflow_dispatch:
    inputs:
      mode:
        description: "daily(전체) / morning(시장 브리핑·뉴스만 재생성) / leads(여신 리드 DART만 재수집)"
        default: daily
        required: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /internal/warmup
        env:
          MODE: ${{ github.event.schedule == '0 22 * * *' && 'morning' || inputs.mode || 'daily' }}
        run: |
          curl -sS --retry 3 --retry-delay 15 --max-time 60 \
            "https://intelligence-poc.onrender.com/internal/warmup?key=${{ secrets.WARMUP_KEY }}&mode=${MODE}"
