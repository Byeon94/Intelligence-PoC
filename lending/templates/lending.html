<div class="capital" id="lending-root">
  <div class="subtabs" id="lending-subtabs" role="tablist">
    <button class="subtab-btn active" data-sub="stock">주식대차</button>
    <button class="subtab-btn" data-sub="bond">채권대차</button>
  </div>

  <!-- ── 주식대차 ── -->
  <div class="sub-panel" data-sub="stock">
    <section class="block">
      <div class="block-head">
        <h3>주식 대차 시장</h3>
        <span class="src-badge sample" title="예탁결제원·KRX 정식 데이터 연동 전 예시 값입니다">예시 데이터</span>
      </div>
      <div class="kpi-grid" id="lend-stock-kpis"></div>
    </section>

    <section class="block">
      <div class="block-head"><h3>대차·공매도 상위 종목 (KRX·협회 공개)</h3></div>
      <div id="lend-stock-table"></div>
    </section>

    <section class="block" id="lend-stock-alert"></section>

    <section class="block">
      <div class="block-head"><h3>관련 뉴스·리서치</h3></div>
      <div id="lend-stock-news"></div>
    </section>
  </div>

  <!-- ── 채권대차 ── -->
  <div class="sub-panel" data-sub="bond" hidden>
    <section class="block">
      <div class="block-head">
        <h3>채권 대차 시장</h3>
        <span class="src-badge sample" title="예탁결제원·KRX 정식 데이터 연동 전 예시 값입니다">예시 데이터</span>
      </div>
      <div class="kpi-grid" id="lend-bond-kpis"></div>
    </section>

    <section class="block">
      <div class="block-head"><h3>채권대차 수요 동향</h3></div>
      <div id="lend-bond-alert"></div>
      <div id="lend-bond-table"></div>
    </section>

    <section class="block">
      <div class="block-head"><h3>관련 뉴스·리서치</h3></div>
      <div id="lend-bond-news"></div>
    </section>
  </div>
</div>
