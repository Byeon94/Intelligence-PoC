<div class="gallery-root">
  <div class="block-head">
    <h3>👤 나의 대시보드</h3>
    <div class="pd-head-actions">
      <button type="button" class="ghost-btn" id="personal-ai-recommend-btn">✨ AI가 추천하기</button>
      <button type="button" class="dart-btn" id="personal-add-widget-btn">+ 위젯 추가</button>
    </div>
  </div>
  <p class="page-note gallery-intro">
    내가 원하는 정보를, 내가 원하는 방식으로. "+ 위젯 추가"를 눌러 위젯을 골라 담으세요.
    (PoC 단계라 로그인 없이 사용하며, <b>선택 내용은 저장되지 않고 새로고침·재접속 시 초기화</b>됩니다.)
  </p>
  <div class="pd-jump-nav" id="personal-jump-nav"></div>
  <div class="gal-grid" id="personal-grid"></div>
</div>

<!-- 위젯 추가 모달: "전사 위젯/부서 위젯" 같은 내부 용어 대신 자연어 카테고리로 보여준다 -->
<div class="wa-modal" id="widget-add-modal" hidden>
  <div class="wa-backdrop" id="wa-backdrop"></div>
  <div class="wa-sheet" role="dialog" aria-modal="true" aria-label="위젯 추가">
    <div class="wa-head">
      <h3>위젯 추가</h3>
      <button type="button" class="wa-close" id="wa-close-btn" aria-label="닫기">✕</button>
    </div>
    <input type="text" class="wa-search" id="wa-search" placeholder="위젯 이름이나 설명으로 검색">
    <div class="wa-body" id="wa-body"></div>
  </div>
</div>

<!-- AI가 추천하기 모달: 프런트 mock 플로우(질문 → 카탈로그 기반 추천). 실제 개인화 백엔드는 없음 -->
<div class="wa-modal" id="ai-recommend-modal" hidden>
  <div class="wa-backdrop" id="ai-backdrop"></div>
  <div class="wa-sheet" role="dialog" aria-modal="true" aria-label="AI가 추천하기">
    <div class="wa-head">
      <h3>✨ 당신에게 맞는 위젯을 추천해드릴게요</h3>
      <button type="button" class="wa-close" id="ai-close-btn" aria-label="닫기">✕</button>
    </div>
    <div class="wa-body" id="ai-body"></div>
  </div>
</div>
