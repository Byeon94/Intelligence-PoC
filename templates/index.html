<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 인텔리전스 홈</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span class="logo">업무 인텔리전스 홈</span>
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">☀️ 라이트</button>
  </div>
</div>

<main>
  <div class="widget-grid">
    {% include "widgets/news_summary.html" %}
  </div>
</main>

<script>
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.getElementById('theme-btn').textContent = t === 'dark' ? '☀️ 라이트' : '🌙 다크';
  localStorage.setItem('theme', t);
}
function toggleTheme() {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
}
applyTheme(localStorage.getItem('theme') || 'dark');
</script>
<script src="{{ url_for('static', filename='widgets/news_summary.js') }}"></script>
</body>
</html>
